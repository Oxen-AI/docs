reviews:
  # more strict review profile
  profile: "assertive"

  # put high level summary in its own comment
  # instead of editing your pr description
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_placeholder: ""

  # also never auto edit titles
  auto_title_placeholder: ""

  # the pr-review channel takes care of this
  suggested_reviewers: false

  # mdx and generators, no docstring coverage gate
  pre_merge_checks:
    docstrings:
      mode: "off"

  # and disable the docstring generation checkbox
  finishing_touches:
    docstrings:
      enabled: false

  path_instructions:
    - path: "**"
      instructions: |
        Do not comment about failing CI, it's already clear and visible.
        Public repo: flag references to private Oxen repos or internal-only systems.
    - path: "getting-started/**"
      instructions: |
        Terminal examples: command in a language-tagged fence (no $ prompt, commands only), then an Output: line, then an untagged output fence.
        Never tag log/table output as bash; the copy button would paste it into a shell.
    - path: "examples/**"
      instructions: |
        Same command/output separation as CLAUDE.md. Multiple steps need separate command/output pairs.
    - path: "inference-api/reference/models/**"
      instructions: |
        Auto-generated by generate-model-docs.py from Hub /api/evaluations/models. Change the generator or Hub schema, not hand-edited .mdx.
        Per-model pages are intentionally omitted from docs.json nav (only model-references index is listed).
    - path: "fine-tuning-api/reference/**"
      instructions: |
        Generated by generate-finetune-docs.py. Regenerate rather than hand-editing tables and supported-model lists.
    - path: "python-api/**"
      instructions: |
        Generated from Oxen oxen-python docstrings via generate-python-docs.sh. Edit source docstrings in the Oxen repo, then regenerate.
    - path: "generate-*.py"
      instructions: |
        Source of truth for generated reference pages. API doc PRs may need generator logic updates, not just .mdx output.
    - path: "docs.json"
      instructions: |
        Mintlify navigation. Adding every inference model page to nav degrades load time; keep the flat list on model-references.mdx unless deliberately changing that policy.

  # auto review new commits
  # auto review draft PRs
  # auto review against any base branch
  # don't pause reviews on active PRs (default pauses after 5 commits)
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - ".*"
